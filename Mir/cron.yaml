cron:
- description: "update law votes"
  url: /core/cron/cron_law.php
  schedule: every day 0:00
  # Retry up to five times (the default) with a starting backoff of 2.5 seconds that doubles each time
  retry_parameters:
    min_backoff_seconds: 2.5
    max_doublings: 5

